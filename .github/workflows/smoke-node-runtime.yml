name: Smoke Node Runtime

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: smoke-node-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: smoke-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build CLI package
        run: pnpm --filter @fiber-pay/cli build

      - name: Link fiber-pay CLI globally via pnpm
        run: pnpm --dir packages/cli link --global

      - name: Verify linked fiber-pay command
        run: fiber-pay --help

      - name: Run node/runtime smoke test
        run: node scripts/ci-smoke-node-runtime.mjs

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-node-runtime-${{ matrix.os }}
          path: ${{ runner.temp }}/fiber-pay-ci-smoke-*
          if-no-files-found: ignore
