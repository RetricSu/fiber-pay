name: E2E WASM Dual Node Testnet

on:
  workflow_dispatch:
    inputs:
      fiber_js_version:
        description: 'Override @nervosnetwork/fiber-js version (e.g. 0.9.0-rc6). Leave empty to use workspace default.'
        required: false
        default: ''

concurrency:
  group: e2e-wasm-dual-node-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-wasm-dual-node:
    name: e2e-wasm-dual-node-testnet
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Override fiber-js version
        if: github.event.inputs.fiber_js_version != ''
        run: pnpm --filter fiber-wasm-dual-node-e2e add @nervosnetwork/fiber-js@${{ github.event.inputs.fiber_js_version }}

      - name: Install dependencies
        if: github.event.inputs.fiber_js_version == ''
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (with override)
        if: github.event.inputs.fiber_js_version != ''
        run: pnpm install

      - name: Install Playwright Chromium
        run: pnpm --filter fiber-wasm-dual-node-e2e exec playwright install --with-deps chromium

      - name: Run WASM dual-node testnet E2E
        run: pnpm --filter fiber-wasm-dual-node-e2e e2e:ci
